# One-time repair of ky_votes.nv_count, which is NULL on every stored roll call.
#
# Why a manual workflow and not a cron: the votes cron runs
# `?source=votes&limit=5`, which re-fetches only the 5 most-recently-actioned
# bills per day. Bills from closed sessions are never revisited, so this data
# cannot heal on its own — it needs one deliberate pass.
#
# Quota: one LegiScan getRollCall per affected roll call. As of 2026-07-31 that
# is 6,944 roll calls across 3,487 bills, ~23.1% of the 30,000/month key limit.
# Scope with `session` to spend less. The default run is an ESTIMATE ONLY — it
# prints the roll call count and projected quota cost and writes nothing. Set
# `live: true` to actually spend quota and update rows.
#
# The script is resumable (targets are selected by nv_count IS NULL), so a run
# that hits the job timeout can simply be dispatched again to pick up where it
# stopped. Use `limit` to size a run to the time available.
#
# Secrets (Settings → Secrets and variables → Actions):
#   LEGISCAN_API_KEY
#   NEXT_PUBLIC_SUPABASE_URL or SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
name: Backfill vote nv_count

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Session to scope to, e.g. "2026 Regular Session". Leave blank for all sessions (~23.1% of monthly quota).'
        type: string
        default: ''
      live:
        description: 'Spend LegiScan quota and write rows. Unchecked = print the estimate only.'
        type: boolean
        default: false
      limit:
        description: 'Cap the number of roll calls fetched (blank = no cap). Useful for a trial run, or to fit a run inside the job timeout.'
        type: string
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# A second concurrent run would double-spend quota on the same bills.
concurrency:
  group: backfill-vote-nv-counts
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill nv_count
    runs-on: ubuntu-latest
    # 6,944 sequential LegiScan fetches plus per-row updates, at a 500ms client
    # rate-limit floor plus real round-trip latency. A full-corpus run does not
    # reliably fit even here — that is what resumability and `limit` are for.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Backfill nv_count
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          # Inputs travel as env vars, never interpolated into the script body:
          # session labels contain spaces ("2026 Regular Session"), which would
          # word-split into three arguments, and `${{ }}` in a run block is a
          # script-injection seam.
          INPUT_SESSION: ${{ inputs.session }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_LIVE: ${{ inputs.live }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$INPUT_SESSION" ]; then
            args+=("--session=$INPUT_SESSION")
          fi
          if [ -n "$INPUT_LIMIT" ]; then
            args+=("--limit=$INPUT_LIMIT")
          fi
          if [ "$INPUT_LIVE" = "true" ]; then
            args+=("--live")
          fi
          npm run backfill:vote-nv-counts -- "${args[@]}"
