# Conservative LegiScan bills sync focused on status / metadata refresh.
#
# Strategy (see src/lib/ky-sync-pipeline.ts — syncKyBillsByHash):
#   --use-change-hash     Master list raw + DB change_hash; unchanged bills skip writes and skip getBill.
#   --skip-bill-sponsor-details   Omits sponsor JSON on upsert; getBill still runs for changed/new bills.
# Topic tags use keyword classifyTopics only during sync (no Anthropic calls on this path).
#
# Quota: hash-gated idle runs cost ~2 LegiScan calls (session list + masterlistraw). Sync holds at
# LEGISCAN_SYNC_QUOTA_STOP_PCT / ACCURACY_LEGISCAN_QUOTA_STOP_PCT (default 95%). Session list is
# cached in ky_sync_state for 7d when getSessionList is slow.
#
# Does NOT replace occasional full sponsor enrichment — run a bills sync without skip locally when needed.
#
# Secrets (Settings → Secrets and variables → Actions):
#   LEGISCAN_API_KEY
#   NEXT_PUBLIC_SUPABASE_URL or SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY
#
# Optional Slack (same Incoming Webhooks as Vercel — see env-template.txt):
#   SLACK_WEBHOOK_STATUS_REPORTS, SLACK_WEBHOOK_ERRORS, SLACK_WEBHOOK_SYNC, SLACK_WEBHOOK_URL, SLACK_SYNC_NOTIFY_CLI=true
# Posts digest on change/error only.
name: Sync KY bill statuses

on:
  workflow_dispatch:
    inputs:
      historic_sessions:
        description: 'How many recent KY sessions to scan (1 = current GA only). Hash skips unchanged bills.'
        type: string
        default: '1'
  schedule:
    # Every 6h — conservative hash-gated sync (~2 LegiScan key requests per run: session list + master list raw).
    # Vercel Cron owns the guaranteed daily bills sync (0 5 UTC); this adds intra-day freshness with no 05:00 overlap.
    - cron: '0 */6 * * *'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Avoid overlapping runs hammering LegiScan if a job is slow or manually re-triggered.
concurrency:
  group: sync-ky-bills-status
  cancel-in-progress: false

jobs:
  sync-bills:
    name: Sync bill statuses (conservative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Bills sync (hash-gated)
        id: bills_sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          SLACK_WEBHOOK_ERRORS: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
          SLACK_WEBHOOK_SYNC: ${{ secrets.SLACK_WEBHOOK_SYNC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_SYNC_NOTIFY_CLI: 'true'
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA="--historic-sessions=${{ inputs.historic_sessions }}"
          fi
          npm run sync:ky:bills:status -- ${EXTRA}

      - name: Retry bills sync after transient failure
        if: failure() && steps.bills_sync.outcome == 'failure'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          SLACK_WEBHOOK_ERRORS: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
          SLACK_WEBHOOK_SYNC: ${{ secrets.SLACK_WEBHOOK_SYNC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_SYNC_NOTIFY_CLI: 'true'
        run: |
          set -euo pipefail
          echo "First bills sync attempt failed; waiting 120s before one retry…"
          sleep 120
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA="--historic-sessions=${{ inputs.historic_sessions }}"
          fi
          npm run sync:ky:bills:status -- ${EXTRA}

      - name: Slack notify on workflow failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "Skip Slack: SLACK_WEBHOOK_ERRORS not set."
            exit 0
          fi
          if [ -f .slack-notified ]; then
            echo "Skip Slack: sync script already posted the failure to #errors."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"*KY Vote — bill status sync workflow failed*\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"
