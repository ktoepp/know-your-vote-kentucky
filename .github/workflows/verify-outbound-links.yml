# HTTP checks on legislator outbound URLs (LRC, website, Ballotpedia, LegiScan).
#
# Requires repository secrets (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL — or set SUPABASE_URL instead (either works)
#   SUPABASE_SERVICE_ROLE_KEY — service_role JWT (not anon)
# Optional but recommended:
#   LEGISCAN_API_KEY — validates LegiScan via getPerson (public HTML often 403 for bots)
#
# Optional Slack (same Incoming Webhooks as sync workflows — see env-template.txt):
#   SLACK_WEBHOOK_STATUS_REPORTS, SLACK_WEBHOOK_ERRORS, SLACK_WEBHOOK_SYNC, SLACK_WEBHOOK_URL, SLACK_SYNC_NOTIFY_CLI=true
#
# Node: opt into Actions’ Node 24 for JS-based actions (checkout/setup-node/upload-artifact)
# before Node 20 is removed from runners. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
name: Verify outbound links

on:
  workflow_dispatch:
  schedule:
    # Weekly — Mondays 06:00 UTC (adjust as needed)
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-legislator-links:
    name: Verify outbound links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
      SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
      SLACK_WEBHOOK_ERRORS: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
      SLACK_WEBHOOK_SYNC: ${{ secrets.SLACK_WEBHOOK_SYNC }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_SYNC_NOTIFY_CLI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Verify legislator links
        run: npm run verify:legislator-links

      - name: Slack notify on workflow failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "Skip Slack: SLACK_WEBHOOK_ERRORS not set."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"*KY Vote — outbound links verify failed*\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"
