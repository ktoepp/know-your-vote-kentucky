# Sync-source health check — an independent second path to the Vercel cron.
#
# `/api/cron/health-check` (Vercel, 14:00 UTC daily) evaluates the same data via
# the same module. This exists because that cron is itself unmonitored: if it
# stops firing, or CRON_SECRET is rotated so every request 401s, the endpoint
# goes silent and nothing notices — the thing that would have complained is the
# thing that stopped. Running the evaluator from a second scheduler means
# whichever one survives still reports.
#
# Both paths share `src/lib/source-health.ts` and the same edge-trigger
# fingerprint in ky_sync_state, so they cannot disagree about what "healthy"
# means and one breach does not page twice.
#
# Required secrets: NEXT_PUBLIC_SUPABASE_URL (or SUPABASE_URL),
#   SUPABASE_SERVICE_ROLE_KEY, SLACK_WEBHOOK_ERRORS, SLACK_SYNC_NOTIFY_CLI=true
# Optional secret: SLACK_WEBHOOK_SUPPORT, the page channel (docs/ops/README.md).
#   Breaches, this run's own failure and the site check post there as well as
#   #errors. Unset, those posts go to #errors only.
name: Sync source health

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Exit non-zero when any source is unhealthy'
        type: boolean
        default: false
      site_check_path:
        description: 'Manual test only: path appended to the checked URL'
        type: string
        default: ''
  schedule:
    # 02:00 UTC — deliberately ~12h out of phase with the Vercel cron (14:00),
    # so a source that breaks just after one check is caught by the other within
    # half a day rather than a full one.
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: source-health
  cancel-in-progress: false

jobs:
  source-health:
    name: Evaluate ky_sources health
    runs-on: ubuntu-latest
    # Reads one small table and posts at most one Slack message.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Evaluate sync source health
        id: evaluate
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_WEBHOOK_ERRORS: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_SUPPORT: ${{ secrets.SLACK_WEBHOOK_SUPPORT }}
          SLACK_SYNC_NOTIFY_CLI: 'true'
        run: |
          npm run health:sources ${{ inputs.strict && '-- --strict' || '' }}

      # Time-based floor on planner statistics (migration 055). Autoanalyze is
      # volume-triggered, so a table below its churn threshold keeps stale stats
      # indefinitely — ky_bills went three weeks between autoanalyzes during the
      # 2026 interim. This runs regardless of the health verdict above, because
      # stale stats are not a source-health breach and should not be skipped
      # when one is found. Advisory: a failure here must not fail the run or
      # mask the health result, so it is continue-on-error.
      - name: Refresh planner statistics
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run db:analyze

      # Advisory triage of any breach the step above found. Runs only on
      # success: a failed evaluation has nothing to interpret, and the fallback
      # step below already reports that case.
      - name: Triage source health
        if: success()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          SLACK_WEBHOOK_SYNC: ${{ secrets.SLACK_WEBHOOK_SYNC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_SYNC_NOTIFY_CLI: 'true'
        run: npm run triage:findings -- --source=health

      # Off-Vercel check that the public site answers (WS9-01, decision (b)).
      # Detection latency up to ~24 h plus GitHub delay (D5). Not an uptime monitor.
      # Runs even when the evaluator crashed, and sits after triage so it never
      # stops triage from running. Schedule runs have no inputs, so they always
      # check the real URLs; site_check_path is for a manual test only and is
      # read through env, never interpolated into the script.
      - name: Check public site responds
        if: always()
        env:
          SITE_CHECK_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.site_check_path || '' }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          SLACK_WEBHOOK_ERRORS: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
          SLACK_WEBHOOK_SUPPORT: ${{ secrets.SLACK_WEBHOOK_SUPPORT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SITE_CHECK_PATH" ] && ! printf '%s' "$SITE_CHECK_PATH" | grep -Eq '^/[A-Za-z0-9._/-]*$'; then
            echo "site_check_path must match ^/[A-Za-z0-9._/-]*\$"
            exit 1
          fi
          check() {
            local url="$1" code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -A "KnowYourVoteKentucky-sitecheck/1.0 (+https://kyvky.com)" "$url") || code=000
            if [ "$code" != "200" ]; then
              echo "$url returned $code; retrying in 30 s"
              sleep 30
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
                -A "KnowYourVoteKentucky-sitecheck/1.0 (+https://kyvky.com)" "$url") || code=000
            fi
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              FAILURES="${FAILURES}*KYvKY site check failed* $url returned $code"$'\n'
            fi
          }
          FAILURES=""
          check "https://www.kyvky.com/${SITE_CHECK_PATH#/}"
          check "https://www.kyvky.com/bills"
          if [ -z "$FAILURES" ]; then
            echo "Site check passed"
            exit 0
          fi
          PAYLOAD=$(jq -n --arg text "${FAILURES}${RUN_URL}" '{text: $text}')
          ok=0
          for URL in "$SLACK_WEBHOOK_ERRORS" "$SLACK_WEBHOOK_SUPPORT"; do
            [ -z "$URL" ] && continue
            if curl -fsS -X POST -H 'Content-Type: application/json' --data "$PAYLOAD" "$URL"; then ok=1; fi
          done
          # Stand the generic notifier down only when this post was delivered and
          # the evaluator itself succeeded; an evaluator failure must still report.
          if [ "$ok" = "1" ] && [ "$EVALUATE_OUTCOME" = "success" ]; then
            touch .slack-notified
          fi
          exit 1

      # Last-resort net: fires only when the step above could not report for
      # itself (setup failure, OOM, timeout kill). The script drops
      # .slack-notified after a *delivered* Slack post, so a successful alert
      # does not double-post — but a failed delivery deliberately leaves the
      # marker absent so this step still speaks up.
      - name: Slack notify on workflow failure or timeout
        if: cancelled() || failure()
        env:
          SLACK_WEBHOOK_ERRORS: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
          SLACK_WEBHOOK_SUPPORT: ${{ secrets.SLACK_WEBHOOK_SUPPORT }}
        run: |
          if [ -z "$SLACK_WEBHOOK_ERRORS" ] && [ -z "$SLACK_WEBHOOK_SUPPORT" ]; then
            echo "Skip Slack: neither SLACK_WEBHOOK_ERRORS nor SLACK_WEBHOOK_SUPPORT is set"
            exit 0
          fi
          if [ -f .slack-notified ]; then
            echo "Skip Slack: script already reported"
            exit 0
          fi
          if [ "${{ job.status }}" = "cancelled" ]; then
            HEADLINE="*Source health check timed out or was cancelled*"
          else
            HEADLINE="*Source health check failed*"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The source-health run is the backstop, so its own failure pages too.
          for URL in "$SLACK_WEBHOOK_ERRORS" "$SLACK_WEBHOOK_SUPPORT"; do
            [ -z "$URL" ] && continue
            curl -sS -X POST -H 'Content-Type: application/json' \
              --data "{\"text\":\"$HEADLINE\nThe run could not report for itself.\n$RUN_URL\"}" \
              "$URL" || true
          done
