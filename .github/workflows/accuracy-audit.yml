# Weekly content-accuracy audit: re-fetches primary sources (LegiScan, Open States,
# LRC) to diff against Supabase, runs an Anthropic LLM pass over fuzzy content, and
# posts a report to Slack. See scripts/accuracy-audit.ts.
#
# Requires repository secrets (Settings -> Secrets and variables -> Actions):
#   NEXT_PUBLIC_SUPABASE_URL  - or set SUPABASE_URL instead (either works)
#   SUPABASE_SERVICE_ROLE_KEY - service_role JWT (not anon)
# Recommended:
#   LEGISCAN_API_KEY    - bill/vote diffs (skipped near the monthly quota cap)
#   OPENSTATES_API_KEY  - legislator roster diff
#   ANTHROPIC_API_KEY   - LLM review pass (omit or set ACCURACY_SKIP_LLM=true to skip)
# Optional Slack (same Incoming Webhooks as the sync workflows - see env-template.txt):
#   SLACK_WEBHOOK_STATUS_REPORTS, SLACK_WEBHOOK_ERRORS, SLACK_WEBHOOK_SYNC, SLACK_WEBHOOK_URL
#   SLACK_SYNC_NOTIFY_CLI=true   (set below so the audit posts from CI)
#
# Node: opt into Actions' Node 24 for JS-based actions before Node 20 is removed.
name: Content accuracy audit

on:
  workflow_dispatch:
  schedule:
    # Weekly - Sundays 07:00 UTC.
    - cron: '0 7 * * 0'

permissions:
  contents: read

# One audit at a time. Without this, a manual `workflow_dispatch` during the
# Sunday cron would interleave writes to ky_accuracy_findings, and each run's
# `fetchRecurrence` would see the other's fresh rows and mislabel new findings
# as recurring. `cancel-in-progress: false` because a running audit shouldn't be
# killed mid-way (its 45m ceiling already bounds it); the second attempt queues
# and either fires after the first finishes or is superseded by a newer request.
concurrency:
  group: accuracy-audit
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  accuracy-audit:
    name: Content accuracy audit
    runs-on: ubuntu-latest
    # Raised from 30 after the 2026-06-21 run was cancelled at the ceiling (API
    # latency / LLM pass overrun). The audit is weekly, so the extra headroom is
    # cheap; a genuine hang still surfaces via the cancelled() Slack notify below.
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
      SLACK_WEBHOOK_ERRORS: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
      SLACK_WEBHOOK_SYNC: ${{ secrets.SLACK_WEBHOOK_SYNC }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_SYNC_NOTIFY_CLI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run content accuracy audit
        run: npm run audit:accuracy

      # Advisory triage of what the audit just recorded, posted to the status
      # channel as a follow-up to the raw digest (never a replacement for it).
      # `if: success()` deliberately, not `always()`: when the audit itself
      # failed operationally there are no findings worth interpreting, and the
      # #errors escalation has already fired.
      - name: Triage findings
        if: success()
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_STATUS_REPORTS: ${{ secrets.SLACK_WEBHOOK_STATUS_REPORTS }}
          SLACK_WEBHOOK_SYNC: ${{ secrets.SLACK_WEBHOOK_SYNC }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_SYNC_NOTIFY_CLI: 'true'
        run: npm run triage:findings -- --source=audit

      - name: Slack notify on workflow failure or timeout
        if: cancelled() || failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_ERRORS }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "Skip Slack: SLACK_WEBHOOK_ERRORS not set."
            exit 0
          fi
          if [ -f .slack-notified ]; then
            echo "Skip Slack: audit script already posted the operational error to #errors."
            exit 0
          fi
          # A timeout-minutes overrun cancels the job (job.status == cancelled);
          # distinguish it from a hard failure so the alert points at the right cause.
          if [ "${JOB_STATUS:-}" = "cancelled" ]; then
            HEADLINE="*KY Vote — accuracy audit timed out or was cancelled*\\nLikely the timeout-minutes ceiling — check the run for where it stalled."
          else
            HEADLINE="*KY Vote — accuracy audit failed*"
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"${HEADLINE}\\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$WEBHOOK"
